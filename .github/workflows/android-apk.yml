name: Rektor Android APK
on:
  push:
    branches: [main, feature/rektor-0.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rektor-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity activation availability without exposing credentials
        id: activation
        shell: bash
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; }; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'APK not built: activated Unity credentials are not configured for this repository.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache@v4
        if: steps.activation.outputs.ready == 'true'
        with:
          path: Library
          key: Rektor-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Rektor-Android-
      - name: Build the actual Unity Android player
        if: steps.activation.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.65f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: KoSch.SchoolTycoon.Editor.SchoolBuild.AndroidCI
          versioning: None
      - name: Verify APK archive and native ARM64 player
        if: steps.activation.outputs.ready == 'true'
        shell: bash
        run: |
          python3 tools/verify_apk.py Builds/Android/Rektor-0.5.0.apk
      - uses: actions/upload-artifact@v4
        if: steps.activation.outputs.ready == 'true' && success()
        with:
          name: Rektor-0.5.0-Android-APK
          path: Builds/Android/Rektor-0.5.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.activation.outputs.ready == 'true' && always()
        with:
          name: Rektor-Unity-build-logs
          path: |
            artifacts/
            Logs/
          if-no-files-found: ignore
