name: Rektor Android APK
on:
  push:
    branches: [main, feature/rektor-0.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rektor-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity activation availability without exposing credentials
        id: activation
        shell: bash
        run: |
          missing=()
          for key in UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            missing+=('UNITY_LICENSE (or UNITY_SERIAL)')
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Unity activation required::APK not built. Missing Actions secrets: ${missing[*]}. See docs/ANDROID.md."
            {
              echo '## APK build blocked: Unity activation required'
              echo
              echo 'No APK was built or uploaded.'
              echo
              echo 'Missing Actions secrets:'
              for key in "${missing[@]}"; do printf -- '- `%s`\n' "$key"; done
              echo
              echo '[Configure the required secrets](https://github.com/chekento/schooltycoon/settings/secrets/actions), then re-run this job.'
              echo
              echo '[Unity activation and APK download instructions](https://github.com/chekento/schooltycoon/blob/main/docs/ANDROID.md)'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.activation.outputs.ready == 'true'
        with:
          path: Library
          key: Rektor-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Rektor-Android-
      - name: Build the actual Unity Android player
        if: steps.activation.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.65f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: KoSch.SchoolTycoon.Editor.SchoolBuild.AndroidCI
          versioning: None
      - name: Verify APK archive and native ARM64 player
        if: steps.activation.outputs.ready == 'true'
        shell: bash
        run: |
          python3 tools/verify_apk.py Builds/Android/Rektor-0.5.0.apk
      - uses: actions/upload-artifact@v4
        if: steps.activation.outputs.ready == 'true' && success()
        with:
          name: Rektor-0.5.0-Android-APK
          path: Builds/Android/Rektor-0.5.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.activation.outputs.ready == 'true' && always()
        with:
          name: Rektor-Unity-build-logs
          path: |
            artifacts/
            Logs/
          if-no-files-found: ignore
