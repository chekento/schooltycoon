name: Rektor Godot Android
on:
  push:
    branches: [main, feature/godot-0.6]
    paths: ['Godot/**', 'Assets/SchoolTycoon/Core/**', 'tools/setup_godot.py', 'tools/verify_godot_apk.py', '.github/workflows/godot-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rektor-godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.419
            9.0.318
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned official Android SDK tools
        run: |
          python3 tools/setup_android.py
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.toolchain/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.toolchain/android-sdk" >> "$GITHUB_ENV"
      - name: Install pinned official Godot .NET editor and templates
        run: |
          python3 tools/setup_godot.py --templates
          echo "GODOT=$GITHUB_WORKSPACE/.toolchain/godot/Godot_v4.5.1-stable_mono_linux_x86_64/Godot_v4.5.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile Godot frontend and shared simulation
        run: dotnet build Godot/Rektor.csproj -p:UseSharedCompilation=false
      - name: Import native Godot resources
        run: '"$GODOT" --headless --path Godot --editor --import'
      - name: Run actual Godot scene and frontend smoke checks
        run: |
          set -o pipefail
          "$GODOT" --headless --path Godot -- --smoke-test | tee godot-smoke.log
          grep -q 'GODOT_SMOKE_PASS' godot-smoke.log
      - name: Configure Android exporter
        run: '"$GODOT" --headless --path Godot --editor --script res://Build/ConfigureAndroid.gd'
      - name: Render actual Godot menu, campus and upgrade UI
        run: |
          xvfb-run -a "$GODOT" --path Godot --rendering-method gl_compatibility -- --capture-preview
          mkdir -p captures
          cp /home/runner/.local/share/godot/app_userdata/Rektor/captures/*.png captures/
      - name: Export actual Android APK
        shell: bash
        run: |
          mkdir -p Builds/Android
          "$GODOT" --headless --path Godot --export-debug Android ../Builds/Android/Rektor-0.6.0-godot.apk 2>&1 | tee godot-export.log
      - name: Verify native APK, package and signature
        run: |
          python3 tools/verify_godot_apk.py Builds/Android/Rektor-0.6.0-godot.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose Builds/Android/Rektor-0.6.0-godot.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging Builds/Android/Rektor-0.6.0-godot.apk
          sha256sum Builds/Android/Rektor-0.6.0-godot.apk > Builds/Android/SHA256SUMS.txt
      - name: Enable hardware acceleration on the ephemeral CI runner
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch the actual APK in Android 30 emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2 -partition-size 4096
          script: bash tools/android_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rektor-0.6.0-Godot-Android
          path: Builds/Android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-native-previews
          path: captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-build-logs
          path: |
            godot-smoke.log
            godot-export.log
            android-smoke.log
          if-no-files-found: ignore
  publish:
    if: github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rektor-0.6.0-Godot-Android
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Godot-native-previews
          path: previews
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rektor-godot-0.6.0
          target_commitish: ${{ github.sha }}
          name: Rektor 0.6.0 · Godot Android Preview
          prerelease: true
          body: |
            Native Godot 4 frontend sharing the complete Unity simulation and original 3D art recipes.
            Android APK: ARM64 + x86-64, Android 7/API 24 or newer, offline gameplay, landscape.
            Six save slots, three difficulties, sandbox, room items, subjects, research, story and mobile controls.
            Built and signature-verified by CI; native frontend smoke checks run on desktop and Android emulator.
            Preview signed with the intentionally public development key, not a Play Store release identity.
            Unity remains in the repository and on archive/unity-0.5. See docs/GODOT.md.
          files: |
            apk/Rektor-0.6.0-godot.apk
            apk/SHA256SUMS.txt
            previews/*.png
