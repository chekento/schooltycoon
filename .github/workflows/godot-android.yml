name: Rektor Godot Android
on:
  push:
    branches: [main, feature/godot-0.6]
    paths: ['Godot/**', 'Assets/SchoolTycoon/Core/**', 'tools/setup_godot.py', 'tools/setup_android.py', 'tools/android_smoke.sh', 'tools/verify_godot_apk.py', 'tools/fix_android_manifest.py', '.github/workflows/godot-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rektor-godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.419
            10.0.403
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned official Android SDK tools
        run: |
          python3 tools/setup_android.py
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.toolchain/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.toolchain/android-sdk" >> "$GITHUB_ENV"
      - name: Install pinned official Godot .NET editor and templates
        run: |
          python3 tools/setup_godot.py --templates
          echo "GODOT=$GITHUB_WORKSPACE/.toolchain/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile Godot frontend and shared simulation
        run: dotnet build Godot/Rektor.csproj -p:UseSharedCompilation=false
      - name: Import native Godot resources
        run: '"$GODOT" --headless --path Godot --editor --import'
      - name: Run actual Godot scene and frontend smoke checks
        run: |
          set -o pipefail
          "$GODOT" --headless --path Godot -- --smoke-test | tee godot-smoke.log
          grep -q 'GODOT_SMOKE_PASS 40 checks' godot-smoke.log
      - name: Configure Android exporter
        run: '"$GODOT" --headless --path Godot --editor --script res://Build/ConfigureAndroid.gd'
      - name: Render actual Godot menu, campus and upgrade UI
        run: |
          xvfb-run -a "$GODOT" --path Godot --rendering-method gl_compatibility -- --capture-preview
          mkdir -p captures
          cp /home/runner/.local/share/godot/app_userdata/Rektor/captures/*.png captures/
      - name: Export actual Android APK
        shell: bash
        run: |
          mkdir -p Builds/Android
          "$GODOT" --headless --path Godot --export-release Android ../Builds/Android/Rektor-0.7.0-godot.apk 2>&1 | tee godot-export.log
      - name: Preserve the Android activity during system resource updates
        run: |
          python3 tools/fix_android_manifest.py Builds/Android/Rektor-0.7.0-godot.apk /tmp/Rektor-unaligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -P 16 -f 4 /tmp/Rektor-unaligned.apk /tmp/Rektor-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign --ks Godot/Build/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out Builds/Android/Rektor-0.7.0-godot.apk /tmp/Rektor-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 Builds/Android/Rektor-0.7.0-godot.apk
      - name: Verify native APK, package and signature
        run: |
          python3 tools/verify_godot_apk.py Builds/Android/Rektor-0.7.0-godot.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose Builds/Android/Rektor-0.7.0-godot.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging Builds/Android/Rektor-0.7.0-godot.apk
          (cd Builds/Android && sha256sum Rektor-0.7.0-godot.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Rektor-0.7.0-Godot-Android
          path: Builds/Android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-native-previews
          path: captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-build-logs
          path: |
            godot-smoke.log
            godot-export.log
            android-smoke.log
          if-no-files-found: ignore
  device:
    name: Android ${{ matrix.api }} startup, touch and resume
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: default
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rektor-0.7.0-Godot-Android
          path: Builds/Android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android tools
        run: |
          python3 tools/setup_android.py
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.toolchain/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.toolchain/android-sdk" >> "$GITHUB_ENV"
      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test actual APK on a 2 GB emulator
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -accel on -gpu swangle -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: bash tools/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-${{ matrix.api }}-previews
          path: captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-${{ matrix.api }}-checks
          path: |
            android-smoke.log
            android-domain-result.log
            android-touch-result.log
            android-memory.log
            android-crash-report.log
          if-no-files-found: ignore
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [android, device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rektor-0.7.0-Godot-Android
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Godot-native-previews
          path: previews
      - uses: actions/download-artifact@v4
        with:
          name: Android-36-previews
          path: previews
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rektor-godot-0.7.0
          target_commitish: ${{ github.sha }}
          name: Rektor 0.7.0 · Android stability and guided campus
          prerelease: true
          body: |
            Native Godot 4.7.2 frontend sharing the complete Unity simulation and original 3D art recipes.
            Android APK: ARM64 + x86-64, Android 7/API 24 or newer, offline gameplay, landscape.
            Six save slots, three difficulties, sandbox, room items, subjects, research, story and mobile controls.
            Optimized release build signed with the same preview identity as 0.6; install as an update to preserve saves.
            Lazy 3D startup, incremental room/actor updates, safer mobile graphics, session resume and local startup diagnostics.
            Mara chapter roadmap, school tower guidance and visible room item effects.
            Signature verified; 40 scene checks, three cold launches, 11 real taps and background/resume checks pass on Android 11 and 16 emulators with 2 GB RAM.
            A physical Samsung/ARM64 device has not been tested here; copy the local diagnostic if a device-specific crash remains.
            Preview signed with the intentionally public development key, not a Play Store release identity.
            Unity remains in the repository and on archive/unity-0.5. See docs/GODOT.md.
          files: |
            apk/Rektor-0.7.0-godot.apk
            apk/SHA256SUMS.txt
            previews/*.png
